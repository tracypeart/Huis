name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUIS_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # GitHub runners are not root, so they cannot create the extraction sandbox.
      # Production workers must (the worker refuses to start otherwise).
      HUIS_ALLOW_UNSANDBOXED_EXTRACTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Document tools (PDF, OCR, Office, media)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng \
            libreoffice-writer libreoffice-calc libreoffice-impress ffmpeg pst-utils qpdf
      - name: Diagnose qpdf (temporary)
        run: |
          qpdf --version | head -1
          printf '%%PDF-1.4\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>\nendobj\ntrailer\n<< /Root 1 0 R >>\n%%%%EOF\n' > /tmp/t.pdf
          set +e
          qpdf --no-warn --show-npages /tmp/t.pdf; echo "exit=$?"
          qpdf --show-npages /tmp/t.pdf; echo "exit=$?"
      - run: npm ci
      - name: Diagnose page count (temporary)
        run: |
          set +e
          mkdir -p /tmp/w
          env -i PATH="$PATH" HOME=/tmp/w TMPDIR=/tmp/w LANG=C.UTF-8 OMP_THREAD_LIMIT=1 qpdf --no-warn --show-npages /tmp/t.pdf; echo "minimal-env exit=$?"
          env -i PATH="$PATH" HOME=/tmp/w TMPDIR=/tmp/w LANG=C.UTF-8 NODE_ENV=production node --import tsx -e 'import("./src/extract/tools.ts").then(async (t) => { try { console.log("count", await t.pdfPageCount("/tmp/t.pdf")); } catch (e) { console.log("ERR", e && e.message); } })'
          env -i PATH="$PATH" HOME=/tmp/w TMPDIR=/tmp/w LANG=C.UTF-8 NODE_ENV=production node --import tsx -e 'import("./src/extract/formats.ts").then(async (f) => { const r = await f.extract({ inputPath: "/tmp/t.pdf", outDir: "/tmp/w", filename: "t.pdf", detectedType: "PDF", depth: 0 }); console.log("extract", r.status, r.detail, r.pages); })'
      - name: Type check
        run: npm run typecheck
      - name: Security and privilege tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
